services:
  iris:
    image: jackpto/iris-crypto-tracker-iris:1.2.0
    build: 
      context: .
      dockerfile: Dockerfile
    hostname: iris
    restart: always
    depends_on:
      jgw:
        condition: service_started
    ports: 
      - 1972
      - 32792:52773
      - 53773
    volumes:
      - ./:/irisdev/app

  jgw:
    image: jackpto/iris-crypto-tracker-jgw:1.2.0
    build:
      context: java
      dockerfile: Dockerfile
    env_file:
      - .env
    restart: always
    ports: 
      - 55555:55555
    volumes:
      - ./java/src/Crypto/db:/jgw/db